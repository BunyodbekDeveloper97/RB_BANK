<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>RB BANK</title>
  </head>
  <body>
    <nav>
      <p class="welcome">Welcome to RB BANK</p>
      <img src="image/RB_BANKpng-black.png" alt="RB Bank Logo" class="logo" />
      <div class="login">
        <input
          type="text"
          placeholder="User"
          class="login__input login__input--user"
          autocomplete="off"
        />
        <input
          type="password"
          placeholder="PIN"
          maxlength="4"
          class="login__input login__input--pin"
          autocomplete="off"
        />
        <button class="login__btn">RB Login &#10140;</button>
      </div>
    </nav>

    <main class="app">
      <div class="balance">
        <div>
          <p class="balance__label">Current balance</p>
          <p class="balance__date">
            As of <span class="date">00/00/0000</span>
          </p>
        </div>
        <p class="balance__value">0,00$</p>
      </div>

      <div class="movements-container">
        <div class="movements-filters">
          <button class="filter-btn filter-btn--active" data-filter="all">
            All
          </button>
          <button class="filter-btn" data-filter="deposit">Deposits</button>
          <button class="filter-btn" data-filter="withdrawal">
            Withdrawals
          </button>
        </div>
        <div class="movements"></div>
      </div>

      <div class="summary">
        <p class="summary__label">In</p>
        <p class="summary__value summary__value--in">0,00$</p>
        <p class="summary__label">Out</p>
        <p class="summary__value summary__value--out">0,00$</p>
        <p class="summary__label">Interest</p>
        <p class="summary__value summary__value--interest">0,00$</p>
        <button class="btn--sort">&#8595; SORT</button>
      </div>

      <div class="operation operation--transfer">
        <h2>Transfer money</h2>
        <div class="form form--transfer">
          <input
            type="text"
            class="form__input form__input--to"
            placeholder="Transfer to"
          />
          <input
            type="number"
            class="form__input form__input--amount"
            placeholder="Amount"
            min="0"
          />
          <button class="form__btn form__btn--transfer">&#8594;</button>
          <label class="form__label">Transfer to</label>
          <label class="form__label">Amount</label>
        </div>
      </div>

      <div class="operation operation--loan">
        <h2>Request loan</h2>
        <div class="form form--loan">
          <input
            type="number"
            class="form__input form__input--loan-amount"
            placeholder="Amount"
            min="0"
          />
          <button class="form__btn form__btn--loan">&#8594;</button>
          <label class="form__label form__label--loan">Amount</label>
        </div>
      </div>

      <div class="operation operation--close">
        <h2>Close account</h2>
        <div class="form form--close">
          <input
            type="text"
            class="form__input form__input--user"
            placeholder="Username"
            autocomplete="off"
          />
          <input
            type="password"
            maxlength="4"
            class="form__input form__input--pin"
            placeholder="PIN"
            autocomplete="off"
          />
          <button class="form__btn form__btn--close">&#8594;</button>
          <label class="form__label">Confirm user</label>
          <label class="form__label">Confirm PIN</label>
        </div>
      </div>

      <p class="logout-timer">
        You will be logged out in <span class="timer">05:00</span>
      </p>
    </main>

    <footer class="footer">
      <p>© 2025 RB GROUP COMPANY. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
